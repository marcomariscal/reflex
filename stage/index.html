<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflex Stage</title>
<style>
  :root {
    --bg: #0a0c0f;
    --panel: #12161b;
    --line: #1f252d;
    --text: #eef2f6;
    --muted: #8a94a3;
    --faint: #5b6471;
    --red: #ff5d5d;
    --green: #3ddc84;
    --amber: #ffb52e;
    --tg-bg: #0e1621;
    --tg-head: #17212b;
    --tg-bubble: #182533;
    --tg-link: #6ab2f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; cursor: default; }
  .stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform: translate(-50%, -50%) scale(var(--s, 1)); }

  /* top: three numbers */
  .stats { position: absolute; top: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 110px; }
  .stat { text-align: center; min-width: 300px; }
  .stat .label { font-size: 20px; color: var(--muted); letter-spacing: .02em; }
  .stat .value { margin-top: 8px; font-size: 84px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; display: inline-flex; align-items: center; gap: 16px; transition: color .4s; }
  .stat .value.bad { color: var(--red); }
  .stat .value.good { color: var(--green); }
  .stat .check { width: 58px; height: 58px; display: none; }
  .stat .value.good .check { display: block; }

  /* main */
  .main { position: absolute; top: 240px; left: 110px; right: 110px; bottom: 50px; display: grid; grid-template-columns: 900px 330px; justify-content: space-between; }

  /* agent column */
  .agent { display: flex; flex-direction: column; min-height: 0; }
  .agent-head { display: flex; align-items: center; gap: 14px; height: 40px; }
  .amp { font-size: 18px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  .pill { font-size: 15px; font-weight: 600; padding: 5px 12px; border-radius: 999px; display: none; }
  .pill.off { display: inline-block; color: var(--red); background: rgba(255, 93, 93, .12); }
  .pill.on { display: inline-block; color: var(--green); background: rgba(61, 220, 132, .12); }
  .convo { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding-top: 24px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 60px); mask-image: linear-gradient(to bottom, transparent 0, #000 60px); }
  .bubble { max-width: 82%; padding: 14px 20px; border-radius: 20px; font-size: 20px; line-height: 1.4; flex: none; }
  .user { align-self: flex-end; background: #1d2a3f; border-bottom-right-radius: 8px; }
  .answer { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 8px; max-width: 92%; }
  .working { align-self: flex-start; color: var(--faint); font-size: 24px; padding: 6px 24px; letter-spacing: .1em; flex: none; }
  .pay { padding: 16px 22px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); flex: none; }
  .pay .row { display: flex; align-items: center; gap: 16px; font-size: 22px; }
  .pay .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; transition: background .3s; }
  .pay .what { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pay .count { color: var(--muted); }
  .pay .tx { margin: 6px 0 0 26px; font: 15px/1.3 ui-monospace, "SF Mono", Menlo, monospace; color: var(--faint); }
  .chip { font-size: 18px; font-weight: 600; padding: 6px 14px; border-radius: 999px; white-space: nowrap; transition: color .3s, background .3s; }
  .t-busy .chip { color: var(--muted); background: #1c2129; }
  .t-wait .chip { color: var(--amber); background: rgba(255, 181, 46, .12); }
  .t-wait .dot { background: var(--amber); }
  .t-ok .chip { color: var(--green); background: rgba(61, 220, 132, .12); }
  .t-ok .dot { background: var(--green); }
  .t-bad .chip { color: var(--red); background: rgba(255, 93, 93, .12); }
  .t-bad .dot { background: var(--red); }
  .t-muted .chip { color: var(--faint); background: #171b21; }
  .t-muted .what { color: var(--muted); }
  .planted { flex: none; margin-left: 22px; padding: 4px 0 4px 20px; border-left: 4px solid var(--red); max-width: 84%; }
  .planted .tag { font-size: 14px; font-weight: 600; color: var(--red); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
  .planted q { font-size: 19px; line-height: 1.4; color: #e3e8ee; }
  .planted .src { margin-top: 4px; font: 15px/1.3 ui-monospace, "SF Mono", Menlo, monospace; color: var(--red); }

  /* phone */
  .phone { width: 330px; height: 610px; border-radius: 52px; padding: 11px; background: #1b1e23; box-shadow: 0 0 0 1px #2a2f37, 0 30px 80px rgba(0, 0, 0, .55); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--tg-bg); display: flex; flex-direction: column; }
  .island { position: absolute; top: 10px; left: 50%; width: 96px; height: 28px; margin-left: -48px; border-radius: 20px; background: #000; z-index: 2; }
  .status { height: 48px; padding: 16px 30px 0; font-size: 14px; font-weight: 600; background: var(--tg-head); }
  .tg-head { display: flex; align-items: center; gap: 10px; padding: 6px 14px 12px; background: var(--tg-head); border-bottom: 1px solid #0c131b; }
  .back { color: var(--tg-link); font-size: 26px; line-height: 1; width: 14px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #5fa8ff, #2f6fed); display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  .who b { display: block; font-size: 16px; font-weight: 600; }
  .who span { font-size: 13px; color: #7d8b99; }
  .chat { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 12px 10px 16px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 40px); mask-image: linear-gradient(to bottom, transparent 0, #000 40px); }
  .card { align-self: flex-start; width: 92%; flex: none; transition: opacity .5s; }
  .card.old { opacity: .45; }
  .msg { background: var(--tg-bubble); border-radius: 14px 14px 14px 4px; padding: 10px 12px 8px; font-size: 15px; line-height: 1.35; }
  .msg .why { color: #c9d3dd; }
  .msg .amt { font-size: 34px; font-weight: 700; letter-spacing: -.01em; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
  .msg .look { margin-top: 4px; font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--amber); }
  .msg .site { font-weight: 600; color: var(--tg-link); }
  .msg .to { font: 12px/1.3 ui-monospace, "SF Mono", Menlo, monospace; color: #8fa1b3; }
  .msg .reason { margin-top: 6px; font-size: 12px; color: #6d7f8f; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .msg .time { text-align: right; font-size: 11px; color: #6d7f8f; margin-top: 2px; }
  .btns { display: flex; gap: 4px; margin-top: 4px; }
  .btns button { flex: 1; font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: rgba(255, 255, 255, .09); border: 0; border-radius: 8px; padding: 9px 0; cursor: pointer; }
  .btns button:hover { background: rgba(255, 255, 255, .14); }
  .btns button:disabled { opacity: .5; cursor: default; }
  .verdict { margin-top: 4px; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 8px; background: rgba(255, 255, 255, .05); }
  .verdict.denied { color: var(--red); }
  .verdict.approved { color: var(--green); }

  .footer { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 14px; color: var(--faint); letter-spacing: .01em; }

  /* caption */
  .caption { position: absolute; left: 50%; top: 660px; transform: translate(-50%, -50%); width: max-content; max-width: 1300px; padding: 26px 48px; border-radius: 28px; text-align: center;
    font-size: 54px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; background: rgba(10, 12, 15, .86); box-shadow: 0 0 0 1px #262c35, 0 30px 90px rgba(0, 0, 0, .6);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); z-index: 5; }
  .caption[hidden] { display: none; }

  .in { animation: fade .35s ease-out backwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .caption.in { animation-name: fade-c; }
  @keyframes fade-c { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .in, .caption.in { animation: none; }
    .stat .value, .card, .chip, .pay .dot { transition: none; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="stats">
    <div class="stat"><div class="label">Paid without asking</div><div class="value" id="auto">0</div></div>
    <div class="stat"><div class="label">Asked you</div><div class="value" id="asked">0</div></div>
    <div class="stat">
      <div class="label">Lost to scammers</div>
      <div class="value" id="lost">
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>
        <span id="lost-usd">$0.00</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="agent">
      <div class="agent-head"><span class="amp">Amp</span><span class="pill" id="pill"></span></div>
      <div class="convo" id="convo"></div>
    </div>
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="status" id="clock">9:41</div>
        <div class="tg-head">
          <span class="back">‹</span>
          <div class="avatar">R</div>
          <div class="who"><b>Reflex</b><span>bot</span></div>
        </div>
        <div class="chat" id="chat"></div>
      </div>
    </div>
  </div>

  <div class="footer" id="footer"></div>
  <div class="caption" id="caption" hidden></div>
</div>

<script>
// Story-free: the server names each line (ev.line) and flags the scammer (ev.scam).
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const short = (a) => (/^0x[0-9a-f]{40,64}$/i.test(a || "") ? `${a.slice(0, 6)}…${a.slice(-4)}` : a || "");
const usd = (n) => `$${Number(n || 0).toFixed(2)}`;
const now = () => new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M$/i, "");
const defaultLane = new URLSearchParams(location.search).get("lane");

let S;
function resetView() {
  S = { auto: 0, lost: 0, scamDenied: false, planted: false, lines: new Map(), calls: new Map(), cards: new Map(), working: null };
  $("convo").replaceChildren();
  $("chat").replaceChildren();
  renderStats();
}
function setLane(lane) {
  $("pill").className = "pill" + (lane ? ` ${lane}` : "");
  $("pill").textContent = lane === "on" ? "Reflex ON" : lane === "off" ? "Reflex OFF" : "";
}
function renderStats() {
  $("auto").textContent = S.auto;
  $("asked").textContent = S.cards.size;
  $("lost-usd").textContent = usd(S.lost);
  $("lost").classList.toggle("bad", S.lost > 0);
  $("lost").classList.toggle("good", S.lost === 0 && S.scamDenied);
}

// ---- conversation ----
function add(node) {
  node.classList.add("in");
  const c = $("convo");
  if (S.working && S.working.parentNode === c) c.insertBefore(node, S.working); else c.append(node);
}
function setWorking(on) {
  if (on && !S.working) { S.working = el("div", "working", "• • •"); $("convo").append(S.working); }
  if (!on && S.working) { S.working.remove(); S.working = null; }
}
// One line per kind of purchase: parallel and repeated calls to it collapse into one updating line.
function line(l) {
  let g = S.lines.get(l.key);
  if (!g) {
    const node = el("div", "pay t-busy");
    const row = el("div", "row");
    row.append(el("span", "dot"), el("span", "what"), el("span", "chip"));
    node.append(row);
    g = { ...l, node, inflight: new Set(), waiting: new Set(), last: null, paid: 0, scam: false, tx: null };
    S.lines.set(l.key, g);
    add(node);
  }
  return g;
}
function renderLine(g) {
  if (!g.node) return;
  let status, tone;
  if (g.waiting.size) [status, tone] = ["Waiting for your OK", "wait"];
  else if (g.inflight.size) [status, tone] = ["Paying…", "busy"];
  else if (g.last === "denied") [status, tone] = ["Denied", "ok"];
  else if (g.last === "paid" || g.paid) [status, tone] = ["Paid", g.scam ? "bad" : "ok"];
  else if (g.last === "free") [status, tone] = ["Free", "muted"];
  else [status, tone] = ["Not paid", "muted"];
  g.node.className = `pay in t-${tone}`;
  const what = g.node.querySelector(".what");
  what.replaceChildren(g.name);
  if (g.site) what.append(el("span", "count", ` · ${g.site}`));
  if (g.paid) what.append(el("span", "count", ` · ${g.paid} paid`));
  g.node.querySelector(".chip").textContent = status;
  if (g.tx) (g.node.querySelector(".tx") || g.node.appendChild(el("div", "tx"))).textContent = `tx ${short(g.tx)}`;
}

function onAgent(ev) {
  if (ev.kind === "user") { add(el("div", "bubble user", ev.text)); setWorking(true); }
  if (ev.kind === "pay") {
    const g = line(ev.line);
    S.calls.set(ev.id, g);
    g.inflight.add(ev.id);
    renderLine(g);
  }
  if (ev.kind === "payResult") {
    const g = S.calls.get(ev.id) || line(ev.line);
    g.inflight.delete(ev.id);
    g.last = { paid: "paid", free: "free", denied: "denied" }[ev.outcome] || "notpaid";
    if (ev.outcome === "paid") g.paid++;
    if (ev.auto) S.auto++;
    if (ev.scam) g.scam = true;
    if (ev.tx) g.tx = ev.tx;
    renderLine(g);
    renderStats();
    if (ev.planted && !S.planted) {
      S.planted = true;
      const box = el("div", "planted");
      box.append(el("div", "tag", ev.planted.label), el("q", null, ev.planted.text));
      if (ev.planted.source) box.append(el("div", "src", ev.planted.source));
      add(box);
    }
  }
  if (ev.kind === "done") { setWorking(false); if (ev.text) add(el("div", "bubble answer", ev.text)); }
}

// ---- phone ----
const WHY = { payee: "New payee. Never paid before.", amount: "Bigger than usual for this payee.", cap: "Over your spending limit.", velocity: "Paying unusually fast." };
// The line a card belongs to: its pay call, else the line the server named, else the newest line still paying.
function cardLine(ev) {
  if (ev.callId && S.calls.has(ev.callId)) return S.calls.get(ev.callId);
  if (ev.line) return line(ev.line);
  return [...S.lines.values()].reverse().find((g) => g.inflight.size) || { waiting: new Set(), node: null };
}
function onCard(ev) {
  let k = S.cards.get(ev.holdId);
  if (!k) {
    const node = el("div", "card in");
    const msg = el("div", "msg");
    const why = (ev.failed || []).map((f) => WHY[f]).find(Boolean) || "Needs your OK.";
    msg.append(el("div", "why", why));
    if (ev.lookalike) msg.append(el("div", "look", ev.lookalike));
    msg.append(el("div", "amt", usd(ev.amount)));
    if (ev.line?.site) msg.append(el("div", "site", ev.line.site));
    msg.append(el("div", "to", `Pay to ${short(ev.recipient)}`));
    if (ev.reason) {
      msg.append(el("div", "reason", `“${ev.reason}” shown, never trusted`));
    }
    msg.append(el("div", "time", now()));
    const btns = el("div", "btns");
    const yes = el("button", null, "Approve"), no = el("button", null, "Deny");
    btns.append(yes, no);
    const verdict = el("div", "verdict");
    node.append(msg, btns, verdict);
    k = { ev, node, btns, verdictEl: verdict, verdict: null, line: null };
    yes.onclick = () => decide(k, "approve");
    no.onclick = () => decide(k, "deny");
    S.cards.set(ev.holdId, k);
    $("chat").append(node);
  }
  k.ev = ev;
  const g = cardLine(ev);
  if (k.line && k.line !== g) k.line.waiting.delete(ev.holdId);
  k.line = g;
  if (ev.scam) g.scam = true;
  const v = { denied: "denied", signed: "approved", expired: "expired", failed: "failed" }[ev.status];
  if (v) setVerdict(k, v);
  else if (ev.status === "held" && !k.verdict) g.waiting.add(ev.holdId);
  renderLine(g);
  renderCard(k);
}
function setVerdict(k, v) {
  if (k.verdict === v) return;
  k.verdict = v;
  k.line.waiting.delete(k.ev.holdId);
  if (v === "denied") k.line.last = "denied";
  if (v === "denied" && k.ev.scam) S.scamDenied = true;
  renderLine(k.line);
}
function renderCard(k) {
  k.btns.hidden = !!k.verdict;
  k.verdictEl.hidden = !k.verdict;
  if (k.verdict) {
    k.verdictEl.className = `verdict ${k.verdict}`;
    k.verdictEl.textContent = { denied: "✕ Denied", approved: "✓ Approved", expired: "Expired", failed: "Approved, but signing failed" }[k.verdict];
  }
  const all = [...S.cards.values()];
  all.forEach((c, i) => c.node.classList.toggle("old", i < all.length - 1 && !!c.verdict)); // earlier, decided
  renderStats();
}
async function decide(k, action) {
  k.btns.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try {
    const r = await fetch(`/decide?action=${action}&hold=${encodeURIComponent(k.ev.holdId)}`, { method: "POST" });
    if (!r.ok) throw new Error(String(r.status));
    setVerdict(k, action === "approve" ? "approved" : "denied");
    renderCard(k);
  } catch {
    k.btns.querySelectorAll("button").forEach((b) => (b.disabled = false));
  }
}

// ---- events ----
function onCaption(text) {
  const c = $("caption");
  c.textContent = text || "";
  c.hidden = !text;
  c.classList.remove("in"); void c.offsetWidth; if (text) c.classList.add("in");
}
function onEvent(ev) {
  if (ev.type === "hello") $("footer").textContent = ev.footer || "";
  if (ev.type === "hello" || ev.type === "reset") { resetView(); setLane(defaultLane); }
  if (ev.type === "run") { resetView(); setLane(ev.lane); }
  if (ev.type === "agent") onAgent(ev);
  if (ev.type === "card") onCard(ev);
  if (ev.type === "stranger") { S.lost = Number(ev.usd) || 0; renderStats(); }
  if (ev.type === "caption") onCaption(ev.text);
}

function fit() { $("stage").style.setProperty("--s", Math.min(innerWidth / 1600, innerHeight / 900)); }
addEventListener("resize", fit);
addEventListener("keydown", (e) => { if (e.key === "r" && !e.metaKey && !e.ctrlKey && !e.altKey) resetView(); });
fit();
resetView();
setLane(defaultLane);
$("clock").textContent = now();
setInterval(() => ($("clock").textContent = now()), 30_000);
new EventSource("/events").onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch {} };
</script>
</body>
</html>
